name: rental_room
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  firebase_auth: ^5.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Architecture & State Management
  flutter_bloc: ^8.1.6
  injectable: ^2.4.2
  get_it: ^7.7.0
  go_router: ^14.2.0

  # Data & Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  shared_preferences: ^2.2.3

  # Utilities & UI
  logger: ^2.3.0
  top_snackbar_flutter: ^3.2.0
#  easy_stepper: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generators
  build_runner: ^2.4.0
  freezed: ^2.5.0
  analyzer: ^6.0.0 # Or allow the latest resolved version
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  intl: ^0.20.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/Logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7f56d9"
  adaptive_icon_foreground: "assets/brand/Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
